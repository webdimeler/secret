name: Build Secret KFS Android APK
on:
  workflow_dispatch:
  push:
    branches: [android-store-app]
    paths:
      - 'android_store/**'
      - '.github/workflows/android-store-app.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: android_store
        run: flutter create --platforms=android --project-name secret_kfs .
      - name: Create Secret KFS launcher icon
        working-directory: android_store
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import math
          # Draw a polished pink boutique icon at high resolution, then export Android launcher sizes.
          n = 512
          im = Image.new("RGB", (n, n), "#f8dce7")
          px = im.load()
          c1, c2 = (255, 236, 243), (183, 54, 111)
          for y in range(n):
              for x in range(n):
                  t = min(1, max(0, (x + y) / (2*n)))
                  px[x,y] = tuple(round(c1[i]*(1-t)+c2[i]*t) for i in range(3))
          mask = Image.new("L", (n,n), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle((30,30,482,482), radius=125, fill=255)
          im.putalpha(mask)
          d = ImageDraw.Draw(im)
          # White medallion and boutique monogram.
          d.ellipse((92,92,420,420), fill=(255,250,252,255), outline=(255,255,255,255), width=8)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf", 235)
          except:
              font = ImageFont.load_default()
          box = d.textbbox((0,0), "S", font=font)
          d.text(((n-(box[2]-box[0]))/2-box[0], (n-(box[3]-box[1]))/2-box[1]-8), "S", font=font, fill="#bd557e", stroke_width=1)
          # Small sparkle accent.
          cx, cy = 376, 143
          d.polygon([(cx,cy-23),(cx+7,cy-7),(cx+23,cy),(cx+7,cy+7),(cx,cy+23),(cx-7,cy+7),(cx-23,cy),(cx-7,cy-7)], fill="#e8a2be")
          base = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = base / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              im.resize((size,size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png")
              im.resize((size,size), Image.Resampling.LANCZOS).save(folder / "ic_launcher_round.png")
          print("Secret KFS launcher icons generated.")
          PY
      - name: Ensure release internet permission
        working-directory: android_store
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          PY
      - name: Resolve dependencies
        working-directory: android_store
        run: flutter pub get
      - name: Build release APK
        working-directory: android_store
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: secret-kfs-android-apk
          path: android_store/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
