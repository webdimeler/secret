<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Secret KFS</title><style>body{font-family:Tahoma,Arial;background:#fff8fa;color:#241b21;margin:0}header{background:white;padding:18px 5%;border-bottom:1px solid #ead6df;display:flex;justify-content:space-between;align-items:center}main{max-width:1000px;margin:28px auto;padding:0 16px}.panel{background:#fff;border:1px solid #ead6df;border-radius:16px;padding:20px;margin-bottom:18px}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #d9c4ce;margin:4px}button{background:#bd527b;color:white;border:0;cursor:pointer}.hidden{display:none}.muted{color:#74666e}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:10px;border-bottom:1px solid #eee}a{color:#a53d67}</style></head><body><header><h2>Secret KFS — لوحة الإدارة</h2><a href="/">عرض المتجر</a></header><main><section class="panel" id="login"><h3>تسجيل دخول المدير</h3><p class="muted">استخدم حساب المدير المُنشأ في Supabase Authentication.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="sign">دخول</button><p id="msg"></p></section><section id="app" class="hidden"><div class="panel"><button id="out">تسجيل الخروج</button><h3>المنتجات</h3><p class="muted">هذه معاينة أولية؛ ستُضاف نماذج الإضافة والتعديل والطلبات في التحديثات التالية.</p><button id="refresh">تحديث المنتجات</button><div id="products"></div></div><div class="panel"><h3>الطلبات</h3><p class="muted">تظهر الطلبات هنا بعد استكمال واجهة الإدارة والتحقق من صلاحيات المدير.</p><div id="orders"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://ywhwqpijlevtoqvhodkf.supabase.co','sb_publishable_x2MuIwfoQKZ6R33K1Tl4_Q_8HZJIUSY');const login=document.querySelector('#login'),app=document.querySelector('#app'),msg=document.querySelector('#msg');async function state(){const {data:{session}}=await db.auth.getSession();login.classList.toggle('hidden',!!session);app.classList.toggle('hidden',!session);if(session)load()}async function load(){const p=document.querySelector('#products');const {data,error}=await db.from('products').select('name,category,price,is_active').order('created_at',{ascending:false});p.innerHTML=error?'تعذر قراءة المنتجات: '+error.message:(data||[]).map(x=>'<p>'+esc(x.name)+' — '+esc(x.category||'')+' — '+Number(x.price).toLocaleString('ar-EG')+' ج.م</p>').join('')||'لا توجد منتجات بعد';const o=document.querySelector('#orders');const {data:orders,error:oe}=await db.from('orders').select('order_number,customer_name,total,status,created_at').order('created_at',{ascending:false}).limit(30);o.innerHTML=oe?'الطلبات غير متاحة أو الصلاحيات تحتاج مراجعة.':(orders||[]).map(x=>'<p>#'+esc(x.order_number)+' — '+esc(x.customer_name)+' — '+Number(x.total).toLocaleString('ar-EG')+' ج.م — '+esc(x.status)+'</p>').join('')||'لا توجد طلبات بعد'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#sign').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});msg.textContent=error?error.message:'تم الدخول';if(!error)state()};document.querySelector('#out').onclick=async()=>{await db.auth.signOut();state()};document.querySelector('#refresh').onclick=load;state();</script></body></html>
