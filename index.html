<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret KFS | المتجر</title>
<style>
:root{--ink:#211a20;--pink:#c65c83;--cream:#fff8fa}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink)}header{padding:22px 6%;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0dce4;position:sticky;top:0}h1{font-size:1.35rem;margin:0;color:var(--pink)}header a,.btn{color:white;background:var(--pink);padding:10px 16px;border-radius:24px;text-decoration:none;border:0;cursor:pointer}.hero{padding:64px 7%;background:linear-gradient(120deg,#f8dce6,#fff8fa);text-align:center}.hero h2{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 12px}.hero p{font-size:1.1rem}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select{padding:12px;border:1px solid #e5cbd5;border-radius:12px;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #f0dce4;border-radius:18px;padding:18px;min-height:130px}.price{color:var(--pink);font-weight:bold}.muted{color:#766a71}.empty{padding:30px;text-align:center;background:white;border-radius:16px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;overflow:auto;padding:18px}.dialog{max-width:650px;margin:20px auto;background:white;border-radius:18px;padding:22px}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #eee}.btn2{background:var(--pink);color:white;border:0;padding:8px 12px;border-radius:9px}.dialog input,.dialog textarea{display:block;width:100%;margin:8px 0;padding:12px;border:1px solid #e5cbd5;border-radius:10px;font:inherit}footer{text-align:center;padding:25px;color:#766a71}
</style>
</head>
<body>
<header><h1>Secret KFS</h1><nav><a href="admin/">لوحة الإدارة</a> <button id="openCart" class="btn">السلة <span id="cartCount">0</span></button></nav></header>
<section class="hero"><h2>أناقتك تبدأ من هنا ✨</h2><p>ملابس، حقائب، إكسسوارات وكل ما يكمّل إطلالتك</p><a class="btn" href="#products">تصفّحي المنتجات</a></section>
<main class="wrap" id="products"><h2>منتجاتنا</h2><div class="bar"><input id="search" placeholder="ابحثي عن منتج…"><select id="category"><option value="">كل الأقسام</option></select></div><div id="status" class="empty">جارٍ تحميل المنتجات…</div><div id="grid" class="grid"></div></main>
<footer><p>Secret KFS · كفر الشيخ أمام كشري الزعيم</p><p><a href="https://maps.app.goo.gl/MuwgDWsxadpVudKU7">موقعنا على الخريطة</a> · <a href="https://wa.me/201550121102">تواصلي عبر واتساب</a></p></footer>
<div id="cartModal" class="modal"><section class="dialog"><button data-close="cartModal">إغلاق</button><h2>سلة المشتريات</h2><div id="cartItems"></div><p>الإجمالي المبدئي: <b id="cartTotal">0</b> ج.م</p><button id="toCheckout" class="btn">إتمام الطلب</button></section></div><div id="checkoutModal" class="modal"><section class="dialog"><button data-close="checkoutModal">إغلاق</button><h2>بيانات الطلب</h2><form id="checkout"><input name="customer_name" required placeholder="الاسم بالكامل"><input name="phone" required placeholder="رقم الهاتف"><input name="address" required placeholder="العنوان بالتفصيل"><input name="email" type="email" placeholder="البريد الإلكتروني (اختياري)"><input name="delivery_service" placeholder="شركة الشحن (اختياري)"><textarea name="notes" placeholder="ملاحظات"></textarea><p id="checkoutMsg"></p><button id="submitOrder" class="btn" type="submit">تأكيد الطلب</button></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ywhwqpijlevtoqvhodkf.supabase.co';
const SUPABASE_KEY='sb_publishable_x2MuIwfoQKZ6R33K1Tl4_Q_8HZJIUSY';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[];
const grid=document.querySelector('#grid'),status=document.querySelector('#status');
function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),c=document.querySelector('#category').value;const rows=products.filter(p=>(!c||p.category===c)&&(!q||((p.name||'')+' '+(p.description||'')).toLowerCase().includes(q)));grid.innerHTML=rows.map(p=>'<article class="card"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||'')+'</p><p class="price">'+Number(p.price).toLocaleString('ar-EG')+' ج.م</p><p class="muted">'+esc(p.category||'')+'</p></article>').join('');status.style.display=rows.length?'none':'block';status.textContent=products.length?'لا توجد منتجات مطابقة حاليًا.':'لم تُضف منتجات بعد. سيظهر المنتج هنا بعد إضافته من لوحة الإدارة.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const {data,error}=await db.from('products').select('id,name,description,category,price,is_active').eq('is_active',true).order('created_at',{ascending:false});if(error)throw error;products=data||[];const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];document.querySelector('#category').innerHTML='<option value="">كل الأقسام</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');render()}catch(e){status.textContent='تعذر تحميل المنتجات. تحقق من إعدادات قاعدة البيانات وصلاحيات القراءة.';console.error(e)}}
document.querySelector('#search').addEventListener('input',render);document.querySelector('#category').addEventListener('change',render);load();
</script><script src="checkout.js"></script>
</body></html>
